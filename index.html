<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Basic Listening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="glow-sphere sphere-1"></div>
  <div class="glow-sphere sphere-2"></div>

  <div class="app-container">
    <header class="app-header">
      <h1 class="logo">LEARN IN ENGLISH</h1>
      
      <div class="controls-bar">
        <!-- レッスン選択ドロップダウン -->
        <div class="select-wrapper">
          <select id="file-select" class="glass-select">
            <option value="">-- Select Lesson --</option>
          </select>
        </div>

        <!-- ビュー切替タブ -->
        <div class="view-tabs">
          <button id="tab-transcript" class="tab-btn active">ハイライト</button>
          <button id="tab-text" class="tab-btn">全文表示</button>
        </div>
      </div>
    </header>

    <!-- メインコンテンツ領域 -->
    <main class="main-content">
      <!-- 1. 単語ハイライト字幕エリア -->
      <div class="transcript-container" id="transcript">
        <div class="placeholder-text">
          <p>Select a lesson to start</p>
        </div>
      </div>

      <!-- 2. 全文テキスト（.txt）表示エリア（初期状態は非表示） -->
      <div class="full-text-container hidden" id="full-text-container">
        <div class="placeholder-text">
          <p>Select a lesson to start</p>
        </div>
      </div>
    </main>

    <!-- プレイヤーカード -->
    <footer class="player-card">
      <audio id="audio-player" preload="metadata"></audio>

      <div class="player-controls">
        <button id="play-btn" class="play-btn" aria-label="Play">
          <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>

        <div class="progress-container">
          <span id="current-time" class="time-display">00:00</span>
          <div class="progress-bar-wrapper" id="progress-bar-wrapper">
            <div class="progress-bar" id="progress-bar"></div>
          </div>
          <span id="duration-time" class="time-display">00:00</span>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
